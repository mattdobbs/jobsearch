# Employers whose own career sites are checked on every scan.
#
# This file is yours to edit. The app reads it at the start of each scan, so changes
# take effect on the next check with no restart.
#
# Until you edit it, the app keeps this file in step with its own built-in list, so
# an update can add employers. Once you change anything here the file is left alone.
# Delete it to go back to the built-in list.
#
# Each [[employer]] has:
#
#   name      Company name as it should appear on cards.
#   aliases   Other names the company posts under on job boards (optional).
#   mode      "program" - every remote job the employer lists becomes a card, because
#                         of the reason given below.
#             "signal"  - a remote job becomes a card only when the posting's own text
#                         welcomes neurodivergent or disabled applicants.
#   kind      For program mode, what the reason rests on (optional):
#               "program" (the default) - a neurodiversity hiring program
#               "index"                 - a disability-inclusion index score
#             Cards are labelled accordingly, so the two can be told apart.
#   reason    Shown on the card as the reason the job is on your board.
#   evidence  A link backing up the reason, shown next to it.
#   ats       Which job system the career site runs on:
#               "greenhouse"  needs  token   (boards.greenhouse.io/<token>)
#               "lever"       needs  token   (jobs.lever.co/<token>)
#               "ashby"       needs  token   (jobs.ashbyhq.com/<token>)
#               "workday"     needs  host, tenant, site
#                             (https://<host>/<site> is the public career site;
#                              set public_base if the public address differs)
#             Leave ats out for an employer with no readable career site: its jobs are
#             then still recognised by name when they show up on a job board.
#
# Whatever the mode, a job is only ever shown when its listing says it is remote.

