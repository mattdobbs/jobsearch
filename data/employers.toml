# ---------------------------------------------------------------------------
# 2. Disability Equality Index
#
# Employers named a "Best Place to Work for Disability Inclusion" (a score of 80 or
# more out of 100) on the Disability Equality Index run by Disability:IN and the
# American Association of People with Disabilities. The index measures disability
# inclusion across a whole company: hiring, accommodations, accessibility, benefits.
# It is a broader and weaker claim than the roundtable's: it does not mean the
# employer runs a neurodiversity hiring program.
#
# The scores are from 2024, the most recent year for which a list of scores could be
# found. Disability:IN no longer publishes one. The evidence link is DirectEmployers
# Association's list of its members' 2024 scores.
# ---------------------------------------------------------------------------

