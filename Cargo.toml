[package]
name = "jobsearch"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
html-escape = "0.3.1"
open = "5.4.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "brotli", "http2", "charset", "query"] }
roxmltree = "0.21.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "fs"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tray-icon = "0.26.1"
uuid = { version = "1.29.2", features = ["v4"] }
wry = "0.57.2"
